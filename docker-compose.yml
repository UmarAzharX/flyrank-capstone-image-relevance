services:
  db:
    image: postgres:16
    container_name: flyrank-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: flyrank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - flyrank_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flyrank"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flyrank_postgres_data: